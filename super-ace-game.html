<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Ace Clone - Terminal Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Legacy SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap');
        
        body {
            background-color: #0a0a0a;
            color: #00ff41;
            font-family: 'JetBrains Mono', monospace;
        }

        .card-slot {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border: 1px solid #1f2937;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            font-weight: 800;
            font-size: 1.2rem;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.5);
        }

        .card-win {
            border-color: #fbbf24;
            color: #fbbf24;
            box-shadow: inset 0 0 15px rgba(251, 191, 36, 0.3);
            transform: scale(1.05);
        }

        .multiplier-badge {
            background: #111;
            border: 1px solid #333;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .multiplier-active {
            color: #fbbf24;
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
        }

        .btn-spin:active { transform: translateY(2px); }
        .btn-disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-black border-2 border-zinc-900 rounded-xl overflow-hidden shadow-2xl">
        
        <!-- Header / Status -->
        <div class="p-4 border-b border-zinc-900 flex justify-between items-center bg-zinc-900/30">
            <div class="text-xs uppercase tracking-tighter">
                <span class="text-zinc-500">Player:</span> <span id="userIdDisplay">User_01</span>
            </div>
            <div class="multiplier-badge multiplier-active" id="currentMultiplier">x1</div>
        </div>

        <!-- Wallet Section -->
        <div class="p-6 text-center border-b border-zinc-900">
            <div class="text-xs text-zinc-500 uppercase mb-1">Total Balance</div>
            <div class="text-3xl font-black text-white">₱<span id="balanceDisplay">0.00</span></div>
        </div>

        <!-- 5x4 Grid Container -->
        <div id="gameGrid" class="p-4 grid grid-cols-5 gap-2 bg-zinc-950">
            <!-- Grid will be injected here by JS -->
        </div>

        <!-- Controls -->
        <div class="p-6 bg-zinc-900/50">
            <div class="flex gap-4 mb-4">
                <div class="flex-1">
                    <label class="text-[10px] text-zinc-500 uppercase block mb-1">Bet Amount</label>
                    <input type="number" id="betAmount" value="10" 
                           class="w-full bg-black border border-zinc-800 p-2 text-center text-white focus:outline-none focus:border-green-500">
                </div>
                <div class="flex-1">
                    <label class="text-[10px] text-zinc-500 uppercase block mb-1">Win Amount</label>
                    <div id="winDisplay" class="w-full bg-black border border-zinc-800 p-2 text-center text-yellow-500 font-bold">0.00</div>
                </div>
            </div>

            <button id="spinBtn" class="btn-spin w-full bg-green-600 hover:bg-green-500 text-black font-black py-4 rounded-lg uppercase tracking-widest text-lg shadow-lg shadow-green-900/20">
                Execute Spin
            </button>
        </div>

        <div class="p-2 text-[8px] text-center text-zinc-600 uppercase border-t border-zinc-900">
            System: Free Play Mode | Logic: Weighted RNG | Database: Firebase RTDB
        </div>
    </div>

    <script>
        // 1. YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyCjTn-hyUdZGiDHsy5_ijYu6KQCYMElsTI",
            authDomain: "casinorewards-95502.firebaseapp.com",
            databaseURL: "https://casinorewards-95502-default-rtdb.firebaseio.com",
            projectId: "casinorewards-95502",
            storageBucket: "casinorewards-95502.firebasestorage.app",
            messagingSenderId: "768311187647",
            appId: "1:768311187647:web:e26e8a5134a003ef634e0a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const userId = "john_sapiera_test"; // Unique User ID

        // Game Configuration
        const SYMBOLS = [
            { name: 'J', weight: 40, payout: 0.5 },
            { name: 'Q', weight: 35, payout: 1.0 },
            { name: 'K', weight: 30, payout: 2.0 },
            { name: 'A', weight: 25, payout: 5.0 },
            { name: 'ACE', weight: 10, payout: 15.0 },
            { name: 'WILD', weight: 5, payout: 50.0 }
        ];

        let balance = 0;
        let isSpinning = false;

        // UI References
        const balanceDisplay = document.getElementById('balanceDisplay');
        const gridContainer = document.getElementById('gameGrid');
        const spinBtn = document.getElementById('spinBtn');
        const winDisplay = document.getElementById('winDisplay');

        // Initialize Balance from Firebase
        db.ref('users/' + userId + '/balance').on('value', (snapshot) => {
            if (snapshot.exists()) {
                balance = snapshot.val();
            } else {
                // If user doesn't exist, give free 1000 credits
                balance = 1000;
                db.ref('users/' + userId).set({ balance: 1000 });
            }
            balanceDisplay.innerText = balance.toFixed(2);
        });

        // Initialize Grid
        function initGrid() {
            gridContainer.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const div = document.createElement('div');
                div.className = 'card-slot rounded border border-zinc-800 text-zinc-700';
                div.innerText = '?';
                gridContainer.appendChild(div);
            }
        }

        function getWeightedSymbol() {
            const pool = [];
            SYMBOLS.forEach(s => {
                for (let i = 0; i < s.weight; i++) pool.push(s);
            });
            return pool[Math.floor(Math.random() * pool.length)];
        }

        async function spin() {
            const bet = parseFloat(document.getElementById('betAmount').value);
            
            if (isSpinning || balance < bet) return;
            isSpinning = true;
            spinBtn.classList.add('btn-disabled');
            winDisplay.innerText = "0.00";

            // 1. Deduct Balance immediately
            balance -= bet;
            db.ref('users/' + userId).update({ balance: balance });

            // 2. Generate Grid with Animation Delay
            gridContainer.innerHTML = '';
            const results = [];
            
            for (let i = 0; i < 20; i++) {
                const symbol = getWeightedSymbol();
                results.push(symbol);
                
                const div = document.createElement('div');
                div.className = 'card-slot rounded';
                div.innerText = symbol.name;
                gridContainer.appendChild(div);
            }

            // 3. Simple Win Logic (Simulating Super Ace Paylines)
            // For MVP: We check for symbols appearing more than 3 times
            let totalWin = 0;
            const counts = {};
            results.forEach(s => counts[s.name] = (counts[s.name] || 0) + 1);

            for (const [name, count] of Object.entries(counts)) {
                if (count >= 3) {
                    const symbolData = SYMBOLS.find(s => s.name === name);
                    totalWin += bet * symbolData.payout * (count / 3);
                }
            }

            // 4. Update Database with Win
            setTimeout(() => {
                if (totalWin > 0) {
                    balance += totalWin;
                    db.ref('users/' + userId).update({ balance: balance });
                    winDisplay.innerText = totalWin.toFixed(2);
                    
                    // Add "Win" visual effect
                    document.querySelectorAll('.card-slot').forEach(el => {
                        if (counts[el.innerText] >= 3) el.classList.add('card-win');
                    });
                }
                isSpinning = false;
                spinBtn.classList.remove('btn-disabled');
            }, 800);
        }

        spinBtn.addEventListener('click', spin);
        initGrid();

    </script>
</body>
</html>
